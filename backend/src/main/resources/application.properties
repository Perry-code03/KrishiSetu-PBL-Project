spring.application.name=krishisetu-backend
server.port=${SERVER_PORT:8080}
context.initializer.classes=com.krishisetu.config.EnvInitializer

# MySQL Database Configuration via environment placeholders
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:krishisetu}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:krishisetu_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security & JWT Token Parameters
krishisetu.jwt.secret=${JWT_SECRET:}
krishisetu.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Allowed Frontend Origins for CORS
krishisetu.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,https://krishi-setu-pbl-project.vercel.app}

# Logging
logging.level.com.krishisetu=INFO
logging.level.org.springframework.security=WARN
